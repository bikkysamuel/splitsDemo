# iOS CI (doc 09): swift-format lint, build, unit tests on an iOS 27.0
# Simulator, plus the scheme test-target check. Runs on the xcode-27 preview
# runner pinned to Xcode 27.0 (Q69). The steps live in scripts/check.sh.
name: ios

on:
  pull_request:
    paths:
      - "ios/**"
      - "api/**"
      - ".github/workflows/ios.yml"
      - "scripts/check.sh"
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "api/**"
      - ".github/workflows/ios.yml"
      - "scripts/check.sh"

permissions:
  contents: read

jobs:
  ios:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version

      - name: Checks (scripts/check.sh ios)
        run: scripts/check.sh ios
