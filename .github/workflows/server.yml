# Server CI (doc 09): format, vet, lint (incl. depguard, ADR-0015), tests
# against a real Postgres 18, govulncheck. The steps live in scripts/check.sh.
name: server

on:
  pull_request:
    paths:
      - "server/**"
      - "api/**"
      - ".github/workflows/server.yml"
      - "scripts/check.sh"
  push:
    branches: [master]
    paths:
      - "server/**"
      - "api/**"
      - ".github/workflows/server.yml"
      - "scripts/check.sh"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: splits
          POSTGRES_DB: splits
          # Ephemeral CI container reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splits -d splits"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://splits@localhost:5432/splits?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Checks (scripts/check.sh server)
        run: scripts/check.sh server

      # doc 09's short fuzz run (~30 s per target) lands with the first fuzz
      # targets in ledger (#8).
