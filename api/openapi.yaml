# The Splits API contract (ADR-0012). Change this file first, then run
# `scripts/generate-api.sh` and commit the regenerated Go and Swift code.
# Conventions are explained in docs/07-api-contract.md; if the two disagree,
# this file wins.
openapi: 3.1.0
info:
  title: Splits API
  version: 0.1.0
  description: |
    REST API for Splits, an expense-sharing app. Health checks live at the
    root; every other endpoint is under `/v1`.

    Every response carries an `X-Request-ID` header: the request's own
    `X-Request-ID` when it sends a valid one (1–64 letters, digits, `-` or
    `_`), otherwise one the server generates. Server logs carry the same ID.
    Request bodies are limited to 64 KB (`request-too-large`).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development (Docker Compose)
tags:
  - name: health
    description: Liveness and readiness checks
  - name: auth
    description: Sign-up, email verification and sign-in (FR-A1–A4)
  - name: me
    description: The signed-in User's own account
  - name: groups
    description: Groups and their Members (FR-G*, FR-M*)
security: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      description: Answers while the process is up and serving HTTP. Does not touch the database.
      tags: [health]
      responses:
        "200":
          description: The server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "500":
          $ref: "#/components/responses/InternalError"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness
      description: Answers 200 when the database is reachable, 503 otherwise.
      tags: [health]
      responses:
        "200":
          description: The server can serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
              example:
                status: ready
        "503":
          $ref: "#/components/responses/NotReady"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/signup:
    post:
      operationId: signUp
      summary: Sign up
      description: |
        Creates an unverified User and sends a verification code (development:
        always `123456`, ADR-0016). Returns a Session at once, so the app can
        keep the User on the verification screen across launches; until the
        email is verified the access token works for `GET /v1/me` only.
        Signing up again with the email of an unverified User replaces that
        User's password and revokes its Sessions: nobody has proved they own
        the address yet.
      tags: [auth]
      requestBody:
        description: The new User's email and password.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
            example:
                email: alice@example.com
                password: correct horse battery
      responses:
        "201":
          description: The User was created; a verification code was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
              example:
                user:
                  id: 0190b6c4-0000-7000-8000-000000000001
                  email: alice@example.com
                  email_verified: false
                access_token: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                access_expires_at: "2026-10-01T09:15:00Z"
                refresh_token: vu8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                refresh_expires_at: "2026-10-31T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EmailTaken"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address
      description: |
        Checks the 6-digit code sent at sign-up or by a resend. A code lasts
        15 minutes, allows 5 attempts and works once (ADR-0016). Every failure,
        including an unknown email, answers `invalid-code`.
      tags: [auth]
      requestBody:
        description: The email being verified and the code sent to it.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
            example:
                email: alice@example.com
                code: "123456"
      responses:
        "200":
          description: The email is verified; a new Session is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
              example:
                user:
                  id: 0190b6c4-0000-7000-8000-000000000001
                  email: alice@example.com
                  email_verified: true
                access_token: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                access_expires_at: "2026-10-01T09:15:00Z"
                refresh_token: vu8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                refresh_expires_at: "2026-10-31T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/verify-email/resend:
    post:
      operationId: resendVerificationCode
      summary: Send a new verification code
      description: |
        Replaces any earlier code. Always answers 202, whether or not the
        email belongs to an unverified User (doc 08).
      tags: [auth]
      requestBody:
        description: The email to send a new code to.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationCodeRequest"
            example:
                email: alice@example.com
      responses:
        "202":
          description: A code was sent if the email belongs to an unverified User.
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/signin:
    post:
      operationId: signIn
      summary: Sign in
      description: |
        Email and password → a new Session. An unverified User gets a Session
        too, with `user.email_verified` false, and goes to verification. A
        wrong email or password answers the same `invalid-credentials`.

        After 5 failures, per account and per client IP, each further failure
        makes the next attempt wait longer: 1 s, then doubling, at most
        15 minutes. An attempt before then answers `too-many-attempts` with
        `Retry-After`, without checking the password. There is no lockout:
        the wait always ends, a successful sign-in clears the account's
        count, and an hour without failures clears both (FR-A4).
      tags: [auth]
      requestBody:
        description: The User's email and password.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
            example:
                email: alice@example.com
                password: correct horse battery
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
              example:
                user:
                  id: 0190b6c4-0000-7000-8000-000000000001
                  email: alice@example.com
                  email_verified: true
                access_token: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                access_expires_at: "2026-10-01T09:15:00Z"
                refresh_token: vu8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                refresh_expires_at: "2026-10-31T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Refresh the Session
      description: |
        Exchanges the refresh token for a new token pair (ADR-0011). The old
        pair stops working at once. Presenting a refresh token that was
        already exchanged is taken as theft: the whole Session is revoked
        and every token of it answers `unauthenticated`. An expired,
        revoked or unknown refresh token answers `unauthenticated` too.
      tags: [auth]
      requestBody:
        description: The Session's current refresh token.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
            example:
              refresh_token: vu8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        "200":
          description: The new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
              example:
                user:
                  id: 0190b6c4-0000-7000-8000-000000000001
                  email: alice@example.com
                  email_verified: true
                access_token: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                access_expires_at: "2026-10-01T09:15:00Z"
                refresh_token: vu8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                refresh_expires_at: "2026-10-31T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/signout:
    post:
      operationId: signOut
      summary: Sign out
      description: |
        Revokes the Session the access token belongs to: its access and
        refresh tokens stop working (ADR-0011). Works for unverified Users
        too.
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Signed out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/IdempotencyKeyInProgress"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups:
    get:
      operationId: listGroups
      summary: My Groups
      description: |
        The Groups where the User is an active Member, oldest first, a page
        at a time (doc 07 list convention).
      tags: [groups]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of Groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPage"
              example:
                items:
                  - id: 0190b6c4-0000-7000-8000-0000000000c1
                    name: Goa trip
                    currency: INR
                    state: active
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createGroup
      summary: Create a Group
      description: |
        Creates a Group in a Group Currency; the creator becomes its first
        Admin under the display name they give (FR-G1). A User can be an
        active Member of at most 200 Groups (FR-G2): the next one answers
        `group-limit-reached`.
      tags: [groups]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The new Group and the creator's name in it.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
            example:
              name: Goa trip
              currency: INR
              display_name: Alice
      responses:
        "201":
          description: The Group was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
              example:
                id: 0190b6c4-0000-7000-8000-0000000000c1
                name: Goa trip
                currency: INR
                state: active
                version: 1
                my_member_id: 0190b6c4-0000-7000-8000-0000000000d1
                members:
                  - id: 0190b6c4-0000-7000-8000-0000000000d1
                    display_name: Alice
                    role: admin
                    status: active
                    placeholder: false
                    join_seq: 1
                    version: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroup
      summary: A Group
      description: |
        The Group with its Members. A Group the User isn't an active Member
        of answers `404`, exactly like one that doesn't exist (doc 07).
      tags: [groups]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The Group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
              example:
                id: 0190b6c4-0000-7000-8000-0000000000c1
                name: Goa trip
                currency: INR
                state: active
                version: 1
                my_member_id: 0190b6c4-0000-7000-8000-0000000000d1
                members:
                  - id: 0190b6c4-0000-7000-8000-0000000000d1
                    display_name: Alice
                    role: admin
                    status: active
                    placeholder: false
                    join_seq: 1
                    version: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: renameGroup
      summary: Rename a Group
      description: |
        Admins only (FR-G3): other Members get `admin-required`. Send the
        `version` you last read; a stale one answers `version-conflict`
        (NFR-R4).
      tags: [groups]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The new name and the version it changes.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameGroupRequest"
            example:
              name: Goa trip 2026
              version: 1
      responses:
        "200":
          description: The renamed Group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
              example:
                id: 0190b6c4-0000-7000-8000-0000000000c1
                name: Goa trip
                currency: INR
                state: active
                version: 1
                my_member_id: 0190b6c4-0000-7000-8000-0000000000d1
                members:
                  - id: 0190b6c4-0000-7000-8000-0000000000d1
                    display_name: Alice
                    role: admin
                    status: active
                    placeholder: false
                    join_seq: 1
                    version: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: addMember
      summary: Add a Member
      description: |
        Any active Member may add one (FR-M1, FR-M2, ADR-0017). With an
        email that a verified User has, that User joins at once. Otherwise
        a Placeholder Member is created, carrying the email if one was
        given; it is Claimed when someone verifies that email. An email or
        display name already in the Group is a field error with code
        `taken` (FR-M3, FR-M4). A Group holds at most 50 Members, Former
        Members and Placeholders included (FR-G2): `member-limit-reached`.
      tags: [groups]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The new Member's display name, and optionally their email.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
            example:
              display_name: Bob
              email: bob@example.com
      responses:
        "201":
          description: The Member was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
              example:
                id: 0190b6c4-0000-7000-8000-0000000000d2
                display_name: Bob
                role: member
                status: active
                placeholder: true
                join_seq: 2
                version: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/MemberId"
    patch:
      operationId: updateMember
      summary: Make a Member an Admin
      description: |
        Admins only (FR-G3). Only an active Member linked to a User can be
        an Admin: Placeholders and Former Members answer
        `member-not-eligible`. Send the Member's `version`
        (`version-conflict` if stale).
      tags: [groups]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The new role and the version it changes.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
            example:
              role: admin
              version: 1
      responses:
        "200":
          description: The updated Member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
              example:
                id: 0190b6c4-0000-7000-8000-0000000000d2
                display_name: Bob
                role: admin
                status: active
                placeholder: false
                join_seq: 2
                version: 2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in User
      description: The app's launch check (FR-U1). Works for unverified Users too.
      tags: [me]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The User the access token belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 0190b6c4-0000-7000-8000-000000000001
                email: alice@example.com
                email_verified: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An opaque access token from an AuthSession (ADR-0011): 32 random
        bytes, base64url, valid 15 minutes. Until the User's email is
        verified it works for `GET /v1/me` only; other endpoints answer
        `email-not-verified`.

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      description: The Group's ID.
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      description: The Member's ID.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; omit for the first page.
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1–200 (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated UUID, required on every write by a signed-in User
        (NFR-R1). Repeating a request with the same key within 24 hours
        returns the original response; reusing a key for a different request
        answers `idempotency-key-reused`, and repeating it while the first is
        still running answers `idempotency-key-in-progress`. Responses with a
        5xx status are not kept, so the request can be retried. Anonymous auth endpoints don't take
        it: their responses carry tokens, which are never stored (ADR-0011).
      schema:
        type: string
        format: uuid

  schemas:
    HealthStatus:
      description: Liveness answer.
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok

    ReadinessStatus:
      description: Readiness answer.
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ready

    Problem:
      description: |
        RFC 9457 problem details. `type` is a stable URI,
        `https://splits.dev/problems/<slug>`, that clients map to a localized
        message. Clients must treat an unknown `type` as a generic error.
        Slugs in use:
        - `not-ready`: the server cannot reach its database (503).
        - `invalid-request`: the request could not be decoded (400).
        - `validation-failed`: one or more fields are invalid; see `errors` (400).
        - `invalid-code`: the one-time code is wrong, expired, used up or unknown (400).
        - `idempotency-key-required`: a write by a signed-in User has no valid `Idempotency-Key` (400).
        - `unauthenticated`: no access token, or it is unknown, expired or revoked (401).
        - `invalid-credentials`: the email or password is wrong (401).
        - `email-not-verified`: the User must verify their email first (403).
        - `email-taken`: a verified User already has this email (409).
        - `idempotency-key-in-progress`: a request with the same `Idempotency-Key` is still being processed (409).
        - `request-too-large`: the request body is over 64 KB (413).
        - `idempotency-key-reused`: the `Idempotency-Key` was used for a different request (422).
        - `too-many-attempts`: too many failed sign-ins; retry after `Retry-After` seconds (429).
        - `admin-required`: only an Admin of the Group may do this (403).
        - `not-found`: no such resource, or one the User can't see (404).
        - `version-conflict`: the resource changed since the `version` sent; reload it (409).
        - `group-limit-reached`: the User is already in 200 Groups (409).
        - `invalid-cursor`: the `cursor` is not one the server gave (400).
        - `member-limit-reached`: the Group already has 50 Members (409).
        - `member-not-eligible`: a Placeholder or Former Member can't be an Admin (409).
        - `group-closed`: the Group is Closed and read-only (409).
        - `internal`: an unexpected server failure (500).
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          pattern: "^https://splits\\.dev/problems/[a-z0-9-]+$"
          examples: ["https://splits.dev/problems/not-ready"]
        title:
          type: string
          description: Short, human-readable summary; not localized, not for display.
          examples: ["Service not ready"]
        status:
          type: integer
          minimum: 400
          maximum: 599
          examples: [503]
        detail:
          type: string
          description: Explanation of this occurrence; not for display.
          examples: ["The database is unreachable."]
        errors:
          description: Field validation failures, one per invalid field.
          type: array
          examples: [[{field: /amount/minor, code: required}]]
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      description: One invalid field in a request body.
      type: object
      required: [field, code]
      additionalProperties: false
      properties:
        field:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid field in the request body.
          examples: ["/amount/minor"]
        code:
          type: string
          description: Stable machine-readable reason, such as `required` or `too_long`.

    Email:
      description: |
        An email address. The server trims surrounding whitespace and compares
        addresses ignoring case (FR-A1).
      type: string
      maxLength: 254
      examples: ["alice@example.com"]

    Password:
      description: |
        10–128 characters, no composition rules; common and breached passwords
        are refused (FR-A3). Field error codes: `too_short`, `too_long`,
        `too_common`.
      type: string
      maxLength: 1024
      examples: ["correct horse battery"]

    OneTimeCode:
      description: "The 6-digit code sent by email (development: `123456`)."
      type: string
      maxLength: 16
      examples: ["123456"]

    SignUpRequest:
      description: Sign-up input (FR-A1, FR-A3).
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"

    VerifyEmailRequest:
      description: Email verification input (FR-A2).
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          $ref: "#/components/schemas/OneTimeCode"

    ResendVerificationCodeRequest:
      description: Asks for a new verification code (FR-A2).
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"

    SignInRequest:
      description: |
        Sign-in input (FR-A4). The password is not checked against the sign-up
        rules, so a wrong one always answers `invalid-credentials`.
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          maxLength: 1024
          examples: ["correct horse battery"]

    RefreshSessionRequest:
      description: Refresh input (ADR-0011).
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 128
          examples: ["vu8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"]

    User:
      description: A User's own profile.
      type: object
      required: [id, email, email_verified]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-000000000001"]
        email:
          type: string
          examples: ["alice@example.com"]
        email_verified:
          type: boolean
          examples: [true]

    AuthSession:
      description: |
        A new Session (ADR-0011): an access token valid 15 minutes and a
        refresh token valid 30 days, both opaque. Keep both in the Keychain.
      type: object
      required: [user, access_token, access_expires_at, refresh_token, refresh_expires_at]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
          examples:
            - id: 0190b6c4-0000-7000-8000-000000000001
              email: alice@example.com
              email_verified: true
        access_token:
          type: string
          examples: ["3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"]
        access_expires_at:
          type: string
          format: date-time
          examples: ["2026-10-01T09:15:00Z"]
        refresh_token:
          type: string
          examples: ["vu8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"]
        refresh_expires_at:
          type: string
          format: date-time
          examples: ["2026-10-31T09:00:00Z"]

    GroupState:
      description: |
        A Group's lifecycle state (FR-G6). Closing and Closed come with M3.
      type: string
      enum: [active, closing, closed]
      examples: ["active"]

    MemberRole:
      description: An Admin or an ordinary Member (FR-G3).
      type: string
      enum: [admin, member]
      examples: ["admin"]

    MemberStatus:
      description: Active, or a Former Member who left or was removed (FR-M7).
      type: string
      enum: [active, former]
      examples: ["active"]

    DisplayName:
      description: |
        A Member's name in one Group: 1–50 characters after trimming,
        unique within the Group ignoring case (FR-M4). Field error codes:
        `required`, `too_long`, `taken`.
      type: string
      maxLength: 200
      examples: ["Alice"]

    GroupName:
      description: "1–100 characters after trimming. Field error codes: `required`, `too_long`."
      type: string
      maxLength: 400
      examples: ["Goa trip"]

    GroupSummary:
      description: A Group in the User's list.
      type: object
      required: [id, name, currency, state]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000c1"]
        name:
          type: string
          examples: ["Goa trip"]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        state:
          $ref: "#/components/schemas/GroupState"

    GroupPage:
      description: One page of the User's Groups.
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
          examples:
            - - id: 0190b6c4-0000-7000-8000-0000000000c1
                name: Goa trip
                currency: INR
                state: active
        next_cursor:
          description: Pass as `cursor` for the next page; null on the last page.
          type: [string, "null"]
          examples: [null]

    Member:
      description: |
        A person's place in one Group (GLOSSARY: Member). `placeholder` is
        true for a Placeholder Member, not yet linked to a User.
      type: object
      required: [id, display_name, role, status, placeholder, join_seq, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        display_name:
          type: string
          examples: ["Alice"]
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        placeholder:
          type: boolean
          examples: [false]
        join_seq:
          description: Order of joining; breaks rounding ties (ADR-0010).
          type: integer
          format: int32
          examples: [1]
        version:
          description: Send it back when changing the Member (NFR-R4).
          type: integer
          format: int32
          examples: [1]

    Group:
      description: A Group with its Members, as one of its Members sees it.
      type: object
      required: [id, name, currency, state, version, my_member_id, members]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000c1"]
        name:
          type: string
          examples: ["Goa trip"]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        state:
          $ref: "#/components/schemas/GroupState"
        version:
          description: Send it back when changing the Group (NFR-R4).
          type: integer
          format: int32
          examples: [1]
        my_member_id:
          description: The signed-in User's Member in this Group.
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        members:
          description: Every Member, Former ones included, in joining order.
          type: array
          items:
            $ref: "#/components/schemas/Member"
          examples:
            - - id: 0190b6c4-0000-7000-8000-0000000000d1
                display_name: Alice
                role: admin
                status: active
                placeholder: false
                join_seq: 1
                version: 1

    CreateGroupRequest:
      description: Create-Group input (FR-G1).
      type: object
      required: [name, currency, display_name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/GroupName"
        currency:
          type: string
          maxLength: 16
          description: "An active ISO 4217 code. Field error code: `invalid`."
          examples: ["INR"]
        display_name:
          $ref: "#/components/schemas/DisplayName"

    AddMemberRequest:
      description: Add-Member input (FR-M1, FR-M2).
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name:
          $ref: "#/components/schemas/DisplayName"
        email:
          description: |
            Optional. Field error codes: `invalid`, `taken` (already in
            this Group).
          type: string
          maxLength: 254
          examples: ["bob@example.com"]

    UpdateMemberRequest:
      description: Grant-Admin input (FR-G3).
      type: object
      required: [role, version]
      additionalProperties: false
      properties:
        role:
          description: Only `admin` can be set; Admin rights aren't taken away in v1.
          type: string
          enum: [admin]
          examples: ["admin"]
        version:
          type: integer
          format: int32
          examples: [1]

    RenameGroupRequest:
      description: Rename input (FR-G3).
      type: object
      required: [name, version]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/GroupName"
        version:
          type: integer
          format: int32
          examples: [1]

    Money:
      description: |
        An amount in integer minor units of an ISO 4217 currency (ADR-0002).
        Never a floating-point number.
      type: object
      required: [minor, currency]
      additionalProperties: false
      properties:
        minor:
          type: integer
          format: int64
          examples: [12345]
        currency:
          $ref: "#/components/schemas/CurrencyCode"

    CurrencyCode:
      description: ISO 4217 alphabetic currency code.
      type: string
      pattern: "^[A-Z]{3}$"
      examples: ["INR"]

    ExchangeRate:
      description: |
        An exact decimal held in a string (ADR-0007), never a JSON number:
        units of the Group currency per one unit of the Expense currency.
        Positive, with at most 2 decimal places (FR-E5).
      type: string
      pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
      examples: ["83.25"]

  responses:
    BadRequest:
      description: |
        The request could not be decoded (`invalid-request`), a field is
        invalid (`validation-failed`, with `errors`), or a one-time code was
        refused (`invalid-code`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/validation-failed
            title: Validation failed
            status: 400
            errors: [{field: /password, code: too_short}]
    Unauthenticated:
      description: No access token, or it is unknown, expired or revoked.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/unauthenticated
            title: Unauthenticated
            status: 401
    InvalidCredentials:
      description: The email or password is wrong.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/invalid-credentials
            title: Invalid credentials
            status: 401
    EmailNotVerified:
      description: The signed-in User must verify their email first.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/email-not-verified
            title: Email not verified
            status: 403
    EmailTaken:
      description: A verified User already has this email.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/email-taken
            title: Email taken
            status: 409
    RequestTooLarge:
      description: The request body is over 64 KB.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/request-too-large
            title: Request too large
            status: 413
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/idempotency-key-reused
            title: Idempotency key reused
            status: 422
    Forbidden:
      description: |
        The signed-in User may not do this: their email isn't verified
        (`email-not-verified`) or they aren't an Admin (`admin-required`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/admin-required
            title: Admin required
            status: 403
    NotFound:
      description: No such resource, or one the User can't see.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/not-found
            title: Not found
            status: 404
    Conflict:
      description: |
        The request conflicts with the current state: a stale `version`
        (`version-conflict`), the Group limit (`group-limit-reached`), or a
        request with the same Idempotency-Key still running
        (`idempotency-key-in-progress`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/version-conflict
            title: Version conflict
            status: 409
    TooManyAttempts:
      description: Too many failed sign-ins; wait before trying again.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt.
          required: true
          schema:
            type: integer
            minimum: 1
          example: 4
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/too-many-attempts
            title: Too many attempts
            status: 429
    IdempotencyKeyInProgress:
      description: A request with the same Idempotency-Key is still being processed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/idempotency-key-in-progress
            title: Idempotency key in progress
            status: 409
    NotReady:
      description: The database is unreachable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/not-ready
            title: Service not ready
            status: 503
            detail: The database is unreachable.
    InternalError:
      description: An unexpected server failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/internal
            title: Internal error
            status: 500
