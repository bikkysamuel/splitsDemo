components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An opaque access token from an AuthSession (ADR-0011): 32 random
        bytes, base64url, valid 15 minutes. Until the User's email is
        verified it works for `GET /v1/me` only; other endpoints answer
        `email-not-verified`.

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      description: The Group's ID.
      schema:
        type: string
        format: uuid
    SettlementId:
      name: settlementId
      in: path
      required: true
      description: The Settlement's ID.
      schema:
        type: string
        format: uuid
    ExpenseId:
      name: expenseId
      in: path
      required: true
      description: The Expense's ID.
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      description: The Member's ID.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; omit for the first page.
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1–200 (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated UUID, required on every write by a signed-in User
        (NFR-R1). Repeating a request with the same key within 24 hours
        returns the original response; reusing a key for a different request
        answers `idempotency-key-reused`, and repeating it while the first is
        still running answers `idempotency-key-in-progress`. Responses with a
        5xx status are not kept, so the request can be retried. Anonymous auth endpoints don't take
        it: their responses carry tokens, which are never stored (ADR-0011).
      schema:
        type: string
        format: uuid

  schemas:
    HealthStatus:
      description: Liveness answer.
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok

    ReadinessStatus:
      description: Readiness answer.
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ready

    Problem:
      description: |
        RFC 9457 problem details. `type` is a stable URI,
        `https://splits.dev/problems/<slug>`, that clients map to a localized
        message. Clients must treat an unknown `type` as a generic error.
        Slugs in use:
        - `not-ready`: the server cannot reach its database (503).
        - `invalid-request`: the request could not be decoded (400).
        - `validation-failed`: one or more fields are invalid; see `errors` (400).
        - `invalid-code`: the one-time code is wrong, expired, used up or unknown (400).
        - `idempotency-key-required`: a write by a signed-in User has no valid `Idempotency-Key` (400).
        - `unauthenticated`: no access token, or it is unknown, expired or revoked (401).
        - `invalid-credentials`: the email or password is wrong (401).
        - `email-not-verified`: the User must verify their email first (403).
        - `email-taken`: a verified User already has this email (409).
        - `idempotency-key-in-progress`: a request with the same `Idempotency-Key` is still being processed (409).
        - `request-too-large`: the request body is over 64 KB (413).
        - `idempotency-key-reused`: the `Idempotency-Key` was used for a different request (422).
        - `too-many-attempts`: too many failed sign-ins; retry after `Retry-After` seconds (429).
        - `admin-required`: only an Admin of the Group may do this (403).
        - `not-found`: no such resource, or one the User can't see (404).
        - `version-conflict`: the resource changed since the `version` sent; reload it (409).
        - `group-limit-reached`: the User is already in 200 Groups (409).
        - `invalid-cursor`: the `cursor` is not one the server gave (400).
        - `member-limit-reached`: the Group already has 50 Members (409).
        - `member-not-eligible`: a Placeholder or Former Member can't be an Admin (409).
        - `group-closed`: the Group is Closed and read-only (409).
        - `not-creator`: only the item's creator may do this (403).
        - `invalid-state`: the item's state doesn't allow this, such as withdrawing it twice (409).
        - `confirmation-required`: the request needs `acknowledge_warnings: true`; see `warnings` (422).

        Field error codes of an Expense (`errors[].code`): `required`,
        `invalid`, `too_long`, `not_positive`, `not_group_currency`,
        `not_a_member` (payer or Split Member isn't an active Member),
        `duplicate_member`, `no_members`, plus `ledger`'s Split reasons.
        - `internal`: an unexpected server failure (500).
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          pattern: "^https://splits\\.dev/problems/[a-z0-9-]+$"
          examples: ["https://splits.dev/problems/not-ready"]
        title:
          type: string
          description: Short, human-readable summary; not localized, not for display.
          examples: ["Service not ready"]
        status:
          type: integer
          minimum: 400
          maximum: 599
          examples: [503]
        detail:
          type: string
          description: Explanation of this occurrence; not for display.
          examples: ["The database is unreachable."]
        errors:
          description: Field validation failures, one per invalid field.
          type: array
          examples: [[{field: /amount/minor, code: required}]]
          items:
            $ref: "#/components/schemas/FieldError"
        warnings:
          description: With `confirmation-required`, what the request would cause.
          type: array
          examples: [[{code: overpayment}]]
          items:
            $ref: "#/components/schemas/Warning"

    FieldError:
      description: One invalid field in a request body.
      type: object
      required: [field, code]
      additionalProperties: false
      properties:
        field:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid field in the request body.
          examples: ["/amount/minor"]
        code:
          type: string
          description: Stable machine-readable reason, such as `required` or `too_long`.

    Email:
      description: |
        An email address. The server trims surrounding whitespace and compares
        addresses ignoring case (FR-A1).
      type: string
      maxLength: 254
      examples: ["alice@example.com"]

    Password:
      description: |
        10–128 characters, no composition rules; common and breached passwords
        are refused (FR-A3). Field error codes: `too_short`, `too_long`,
        `too_common`.
      type: string
      maxLength: 1024
      examples: ["correct horse battery"]

    OneTimeCode:
      description: "The 6-digit code sent by email (development: `123456`)."
      type: string
      maxLength: 16
      examples: ["123456"]

    SignUpRequest:
      description: Sign-up input (FR-A1, FR-A3).
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"

    VerifyEmailRequest:
      description: Email verification input (FR-A2).
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          $ref: "#/components/schemas/OneTimeCode"

    ResendVerificationCodeRequest:
      description: Asks for a new verification code (FR-A2).
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"

    SignInRequest:
      description: |
        Sign-in input (FR-A4). The password is not checked against the sign-up
        rules, so a wrong one always answers `invalid-credentials`.
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          maxLength: 1024
          examples: ["correct horse battery"]

    RefreshSessionRequest:
      description: Refresh input (ADR-0011).
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 128
          examples: ["vu8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"]

    User:
      description: A User's own profile.
      type: object
      required: [id, email, email_verified]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-000000000001"]
        email:
          type: string
          examples: ["alice@example.com"]
        email_verified:
          type: boolean
          examples: [true]

    AuthSession:
      description: |
        A new Session (ADR-0011): an access token valid 15 minutes and a
        refresh token valid 30 days, both opaque. Keep both in the Keychain.
      type: object
      required: [user, access_token, access_expires_at, refresh_token, refresh_expires_at]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
          examples:
            - id: 0190b6c4-0000-7000-8000-000000000001
              email: alice@example.com
              email_verified: true
        access_token:
          type: string
          examples: ["3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"]
        access_expires_at:
          type: string
          format: date-time
          examples: ["2026-10-01T09:15:00Z"]
        refresh_token:
          type: string
          examples: ["vu8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"]
        refresh_expires_at:
          type: string
          format: date-time
          examples: ["2026-10-31T09:00:00Z"]

    GroupState:
      description: |
        A Group's lifecycle state (FR-G6). Closing and Closed come with M3.
      type: string
      enum: [active, closing, closed]
      examples: ["active"]

    MemberRole:
      description: An Admin or an ordinary Member (FR-G3).
      type: string
      enum: [admin, member]
      examples: ["admin"]

    MemberStatus:
      description: Active, or a Former Member who left or was removed (FR-M7).
      type: string
      enum: [active, former]
      examples: ["active"]

    DisplayName:
      description: |
        A Member's name in one Group: 1–50 characters after trimming,
        unique within the Group ignoring case (FR-M4). Field error codes:
        `required`, `too_long`, `taken`.
      type: string
      maxLength: 200
      examples: ["Alice"]

    GroupName:
      description: "1–100 characters after trimming. Field error codes: `required`, `too_long`."
      type: string
      maxLength: 400
      examples: ["Goa trip"]

    GroupSummary:
      description: A Group in the User's list.
      type: object
      required: [id, name, currency, state]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000c1"]
        name:
          type: string
          examples: ["Goa trip"]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        state:
          $ref: "#/components/schemas/GroupState"

    GroupPage:
      description: One page of the User's Groups.
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
          examples:
            - - id: 0190b6c4-0000-7000-8000-0000000000c1
                name: Goa trip
                currency: INR
                state: active
        next_cursor:
          description: Pass as `cursor` for the next page; null on the last page.
          type: [string, "null"]
          examples: [null]

    Member:
      description: |
        A person's place in one Group (GLOSSARY: Member). `placeholder` is
        true for a Placeholder Member, not yet linked to a User.
      type: object
      required: [id, display_name, role, status, placeholder, join_seq, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        display_name:
          type: string
          examples: ["Alice"]
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        placeholder:
          type: boolean
          examples: [false]
        join_seq:
          description: Order of joining; breaks rounding ties (ADR-0010).
          type: integer
          format: int32
          examples: [1]
        version:
          description: Send it back when changing the Member (NFR-R4).
          type: integer
          format: int32
          examples: [1]

    Group:
      description: A Group with its Members, as one of its Members sees it.
      type: object
      required: [id, name, currency, state, version, my_member_id, members]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000c1"]
        name:
          type: string
          examples: ["Goa trip"]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        state:
          $ref: "#/components/schemas/GroupState"
        version:
          description: Send it back when changing the Group (NFR-R4).
          type: integer
          format: int32
          examples: [1]
        my_member_id:
          description: The signed-in User's Member in this Group.
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        members:
          description: Every Member, Former ones included, in joining order.
          type: array
          items:
            $ref: "#/components/schemas/Member"
          examples:
            - - id: 0190b6c4-0000-7000-8000-0000000000d1
                display_name: Alice
                role: admin
                status: active
                placeholder: false
                join_seq: 1
                version: 1

    CreateGroupRequest:
      description: Create-Group input (FR-G1).
      type: object
      required: [name, currency, display_name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/GroupName"
        currency:
          type: string
          maxLength: 16
          description: "An active ISO 4217 code. Field error code: `invalid`."
          examples: ["INR"]
        display_name:
          $ref: "#/components/schemas/DisplayName"

    AddMemberRequest:
      description: Add-Member input (FR-M1, FR-M2).
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name:
          $ref: "#/components/schemas/DisplayName"
        email:
          description: |
            Optional. Field error codes: `invalid`, `taken` (already in
            this Group).
          type: string
          maxLength: 254
          examples: ["bob@example.com"]

    UpdateMemberRequest:
      description: Grant-Admin input (FR-G3).
      type: object
      required: [role, version]
      additionalProperties: false
      properties:
        role:
          description: Only `admin` can be set; Admin rights aren't taken away in v1.
          type: string
          enum: [admin]
          examples: ["admin"]
        version:
          type: integer
          format: int32
          examples: [1]

    RenameGroupRequest:
      description: Rename input (FR-G3).
      type: object
      required: [name, version]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/GroupName"
        version:
          type: integer
          format: int32
          examples: [1]

    Category:
      description: The fixed Category list (D7); the app localizes the names.
      type: string
      enum: [food_drink, groceries, transport, accommodation, rent, utilities, entertainment, shopping, health, travel, other]
      examples: ["food_drink"]

    SplitMethod:
      description: |
        How the Expense is divided (FR-E2). Equal only for now; exact,
        percentage and ratio follow (#18).
      type: string
      enum: [equal]
      examples: ["equal"]

    ExpenseState:
      description: |
        Where the Expense is in its life (doc 06). In M1 every Expense is
        accepted at once (D9); the agreement states arrive with M2.
      type: string
      enum: [pending, accepted, disputed, withdrawal_pending, withdrawn]
      examples: ["accepted"]

    SplitInput:
      description: Who shares the Expense, and how.
      type: object
      required: [method, members]
      additionalProperties: false
      properties:
        method:
          $ref: "#/components/schemas/SplitMethod"
        members:
          description: 1–50 distinct active Members.
          type: array
          maxItems: 50
          items:
            type: object
            required: [member_id]
            additionalProperties: false
            properties:
              member_id:
                type: string
                format: uuid
          examples:
            - - member_id: 0190b6c4-0000-7000-8000-0000000000d1

    ExpenseInput:
      description: An Expense as entered (FR-E1). Previews and creates take the same input.
      type: object
      required: [payer_member_id, amount, category, spent_on, split]
      additionalProperties: false
      properties:
        payer_member_id:
          description: Any active Member, Placeholders included (FR-E3).
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        amount:
          description: "> 0, in the Group Currency for now (foreign currencies: #19)."
          $ref: "#/components/schemas/Money"
          examples:
            - {minor: 100001, currency: INR}
        category:
          $ref: "#/components/schemas/Category"
        note:
          description: Optional, at most 500 characters after trimming (D1).
          type: string
          maxLength: 2000
          examples: ["Dinner at the beach shack"]
        spent_on:
          description: The day the money was spent.
          type: string
          format: date
          examples: ["2026-10-01"]
        split:
          $ref: "#/components/schemas/SplitInput"

    ShareLine:
      description: One Member's Share.
      type: object
      required: [member_id, share]
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        share:
          $ref: "#/components/schemas/Money"

    ExpensePreview:
      description: The Shares an Expense would get, in the Split's order.
      type: object
      required: [amount, shares]
      additionalProperties: false
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ShareLine"
          examples:
            - - member_id: 0190b6c4-0000-7000-8000-0000000000d1
                share: {minor: 100001, currency: INR}

    ExpenseSummary:
      description: An Expense in a list.
      type: object
      required: [id, payer_member_id, amount, category, spent_on, state]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000e1"]
        payer_member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        amount:
          $ref: "#/components/schemas/Money"
        category:
          $ref: "#/components/schemas/Category"
        note:
          type: string
          examples: ["Dinner at the beach shack"]
        spent_on:
          type: string
          format: date
          examples: ["2026-10-01"]
        state:
          $ref: "#/components/schemas/ExpenseState"

    ExpensePage:
      description: One page of a Group's Expenses.
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseSummary"
          examples:
            - - id: 0190b6c4-0000-7000-8000-0000000000e1
                payer_member_id: 0190b6c4-0000-7000-8000-0000000000d1
                amount: {minor: 100001, currency: INR}
                category: food_drink
                spent_on: "2026-10-01"
                state: accepted
        next_cursor:
          description: The cursor of the next page of Expenses; null on the last page.
          type: [string, "null"]
          examples: [null]

    Expense:
      description: An Expense with its Shares (FR-E1).
      type: object
      required: [id, group_id, payer_member_id, created_by_member_id, amount, category, spent_on, split_method, state, version, created_at, shares]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000e1"]
        group_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000c1"]
        payer_member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        created_by_member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        amount:
          $ref: "#/components/schemas/Money"
        category:
          $ref: "#/components/schemas/Category"
        note:
          type: string
          examples: ["Dinner at the beach shack"]
        spent_on:
          type: string
          format: date
          examples: ["2026-10-01"]
        split_method:
          $ref: "#/components/schemas/SplitMethod"
        state:
          $ref: "#/components/schemas/ExpenseState"
        version:
          type: integer
          format: int32
          examples: [1]
        created_at:
          type: string
          format: date-time
          examples: ["2026-10-01T19:30:00Z"]
        shares:
          description: Every Member in the Split, in joining order.
          type: array
          items:
            $ref: "#/components/schemas/ShareLine"
          examples:
            - - member_id: 0190b6c4-0000-7000-8000-0000000000d1
                share: {minor: 100001, currency: INR}

    Warning:
      description: |
        A consequence the User must confirm (D16). Codes: `overpayment`
        (the Settlement is more than the payer owes, or more than the
        receiver is owed).
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          examples: ["overpayment"]

    SettlementState:
      description: Where the Settlement is in its life (doc 06). In M1 every Settlement counts at once (D9).
      type: string
      enum: [pending, accepted, disputed, withdrawal_pending, withdrawn]
      examples: ["accepted"]

    SettlementInput:
      description: A Settlement as entered (FR-S1).
      type: object
      required: [from_member_id, to_member_id, amount, settled_on]
      additionalProperties: false
      properties:
        from_member_id:
          description: The Member who paid.
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d2"]
        to_member_id:
          description: The Member who was paid; not the payer.
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        amount:
          description: "> 0, in the Group Currency."
          $ref: "#/components/schemas/Money"
          examples:
            - {minor: 33334, currency: INR}
        settled_on:
          type: string
          format: date
          examples: ["2026-10-02"]
        note:
          description: Optional, at most 500 characters after trimming (D1).
          type: string
          maxLength: 2000
          examples: ["UPI"]
        acknowledge_warnings:
          description: Save despite the warnings of a `confirmation-required` answer (D16).
          type: boolean
          examples: [true]

    Settlement:
      description: A record that one Member paid another back (GLOSSARY).
      type: object
      required: [id, group_id, from_member_id, to_member_id, amount, settled_on, created_by_member_id, state, version, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000f1"]
        group_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000c1"]
        from_member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d2"]
        to_member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        amount:
          $ref: "#/components/schemas/Money"
        settled_on:
          type: string
          format: date
          examples: ["2026-10-02"]
        note:
          type: string
          examples: ["UPI"]
        created_by_member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d2"]
        state:
          $ref: "#/components/schemas/SettlementState"
        version:
          type: integer
          format: int32
          examples: [1]
        created_at:
          type: string
          format: date-time
          examples: ["2026-10-02T10:00:00Z"]

    SettlementPage:
      description: One page of a Group's Settlements.
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"
          examples:
            - []
        next_cursor:
          description: The cursor of the next page of Settlements; null on the last page.
          type: [string, "null"]
          examples: [null]

    VersionRequest:
      description: The version an action applies to (NFR-R4).
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int32
          examples: [1]

    MemberBalance:
      description: One Member's Balance; positive means they are owed money.
      type: object
      required: [member_id, balance]
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        balance:
          $ref: "#/components/schemas/Money"

    SettleUpSuggestion:
      description: A payment that helps settle the Group (GLOSSARY).
      type: object
      required: [from_member_id, to_member_id, amount]
      additionalProperties: false
      properties:
        from_member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d2"]
        to_member_id:
          type: string
          format: uuid
          examples: ["0190b6c4-0000-7000-8000-0000000000d1"]
        amount:
          $ref: "#/components/schemas/Money"

    GroupBalances:
      description: A Group's Balances and Settle-up Suggestions (FR-B1, FR-B2).
      type: object
      required: [balances, suggestions]
      additionalProperties: false
      properties:
        balances:
          description: Every Member, Former Members included, in joining order.
          type: array
          items:
            $ref: "#/components/schemas/MemberBalance"
          examples:
            - - member_id: 0190b6c4-0000-7000-8000-0000000000d1
                balance: {minor: 0, currency: INR}
        suggestions:
          description: In the order chosen; empty when everyone is settled.
          type: array
          items:
            $ref: "#/components/schemas/SettleUpSuggestion"
          examples:
            - []

    Money:
      description: |
        An amount in integer minor units of an ISO 4217 currency (ADR-0002).
        Never a floating-point number.
      type: object
      required: [minor, currency]
      additionalProperties: false
      properties:
        minor:
          type: integer
          format: int64
          examples: [12345]
        currency:
          $ref: "#/components/schemas/CurrencyCode"

    CurrencyCode:
      description: ISO 4217 alphabetic currency code.
      type: string
      pattern: "^[A-Z]{3}$"
      examples: ["INR"]

    ExchangeRate:
      description: |
        An exact decimal held in a string (ADR-0007), never a JSON number:
        units of the Group currency per one unit of the Expense currency.
        Positive, with at most 2 decimal places (FR-E5).
      type: string
      pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
      examples: ["83.25"]

  responses:
    BadRequest:
      description: |
        The request could not be decoded (`invalid-request`), a field is
        invalid (`validation-failed`, with `errors`), or a one-time code was
        refused (`invalid-code`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/validation-failed
            title: Validation failed
            status: 400
            errors: [{field: /password, code: too_short}]
    Unauthenticated:
      description: No access token, or it is unknown, expired or revoked.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/unauthenticated
            title: Unauthenticated
            status: 401
    InvalidCredentials:
      description: The email or password is wrong.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/invalid-credentials
            title: Invalid credentials
            status: 401
    EmailNotVerified:
      description: The signed-in User must verify their email first.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/email-not-verified
            title: Email not verified
            status: 403
    EmailTaken:
      description: A verified User already has this email.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/email-taken
            title: Email taken
            status: 409
    RequestTooLarge:
      description: The request body is over 64 KB.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/request-too-large
            title: Request too large
            status: 413
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/idempotency-key-reused
            title: Idempotency key reused
            status: 422
    Forbidden:
      description: |
        The signed-in User may not do this: their email isn't verified
        (`email-not-verified`) or they aren't an Admin (`admin-required`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/admin-required
            title: Admin required
            status: 403
    NotFound:
      description: No such resource, or one the User can't see.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/not-found
            title: Not found
            status: 404
    Conflict:
      description: |
        The request conflicts with the current state: a stale `version`
        (`version-conflict`), the Group limit (`group-limit-reached`), or a
        request with the same Idempotency-Key still running
        (`idempotency-key-in-progress`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/version-conflict
            title: Version conflict
            status: 409
    TooManyAttempts:
      description: Too many failed sign-ins; wait before trying again.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt.
          required: true
          schema:
            type: integer
            minimum: 1
          example: 4
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/too-many-attempts
            title: Too many attempts
            status: 429
    Unprocessable:
      description: |
        The request needs confirming (`confirmation-required`, with
        `warnings`) or reuses an Idempotency-Key for a different request
        (`idempotency-key-reused`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/confirmation-required
            title: Confirmation required
            status: 422
            warnings: [{code: overpayment}]
    IdempotencyKeyInProgress:
      description: A request with the same Idempotency-Key is still being processed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/idempotency-key-in-progress
            title: Idempotency key in progress
            status: 409
    NotReady:
      description: The database is unreachable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/not-ready
            title: Service not ready
            status: 503
            detail: The database is unreachable.
    InternalError:
      description: An unexpected server failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://splits.dev/problems/internal
            title: Internal error
            status: 500
